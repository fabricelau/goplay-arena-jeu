<title>Pixel Rush</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#07051A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Rajdhani:wght@500;600;700&display=swap">
<style>
/* Sol de dalles lumineuses façon GoPixel : grille carrée centrée, HUD au-dessus, écrans en verre sombre. Un seul thème néon. */
:root{
  --void:#07051A; --deep:#120C33; --panel:rgba(18,12,51,.86); --line:#2E2470; --tile:#140E38;
  --core:#B57BFF; --cyan:#3DF0FF; --go:#3DFF9A; --no:#FF3D5E; --gold:#FFC22E;
  --text:#EDEAFF; --muted:#A39BDB;
  --display:"Chakra Petch",ui-sans-serif,system-ui,sans-serif;
  --body:"Rajdhani",ui-sans-serif,system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;background:var(--void);color:var(--text);overflow:hidden;font-family:var(--body);font-size:17px;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(ellipse at 50% 55%,rgba(120,70,255,.22),transparent 60%),var(--void)}
.stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding-block:calc(env(safe-area-inset-top,0px) + 76px) calc(env(safe-area-inset-bottom,0px) + 24px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#grid{--n:3;--sz:min(92vw,calc(100dvh - 210px),520px);width:var(--sz);height:var(--sz);display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:calc(var(--sz) * .028);padding:calc(var(--sz) * .03);border-radius:18px;background:rgba(18,12,51,.7);border:1px solid var(--line);box-shadow:0 0 40px rgba(120,70,255,.25) inset;touch-action:none;transition:transform .08s}
#grid.shake{animation:shake .28s}
@keyframes shake{20%{transform:translate(-7px,2px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,1px)}80%{transform:translate(3px,0)}}
.cell{position:relative;border:0;border-radius:12%;background:var(--tile);box-shadow:inset 0 0 0 1px rgba(90,70,200,.35);cursor:pointer;padding:0;overflow:visible;transition:background .12s,box-shadow .12s,transform .08s}
.cell::after{content:"";position:absolute;inset:18%;border-radius:10%;border:1px dashed rgba(90,70,200,.18)}
.cell.go{background:var(--go);box-shadow:0 0 22px rgba(61,255,154,.7),inset 0 0 0 3px rgba(255,255,255,.55)}
.cell.no{background:var(--no);box-shadow:0 0 22px rgba(255,61,94,.7),inset 0 0 0 3px rgba(255,255,255,.35)}
.cell.gold{background:var(--gold);box-shadow:0 0 28px rgba(255,194,46,.9),inset 0 0 0 3px #fff}
.cell.go::after,.cell.no::after,.cell.gold::after{border:0}
.cell.no::before{content:"";position:absolute;inset:30%;background:linear-gradient(45deg,transparent 42%,rgba(60,0,15,.55) 42% 58%,transparent 58%),linear-gradient(-45deg,transparent 42%,rgba(60,0,15,.55) 42% 58%,transparent 58%)}
.cell.gold::before{content:"★";position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--sz) / var(--n) * .42);color:#7A4A00}
.cell .bar{position:absolute;left:10%;right:10%;bottom:7%;height:6%;border-radius:4px;background:rgba(7,5,26,.55);transform-origin:left;transform:scaleX(0)}
.cell.hit{transform:scale(.9)}
.cell.bad{background:#FF3D5E;animation:bad .3s}
@keyframes bad{50%{transform:scale(1.08)}}
.cell.miss{animation:miss .35s}
@keyframes miss{0%{background:rgba(61,255,154,.5)}100%{background:var(--tile)}}
.fx{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font:700 calc(var(--sz) / var(--n) * .24) var(--display);color:#fff;text-shadow:0 0 10px rgba(0,0,0,.7);pointer-events:none;animation:up .6s forwards;white-space:nowrap;z-index:2}
@keyframes up{to{transform:translate(-50%,-160%);opacity:0}}
.hud{position:fixed;top:0;left:0;right:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none;font-family:var(--display);font-variant-numeric:tabular-nums}
.hud small{display:block;font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;font-family:var(--body);font-weight:600}
.hud .sc{font-size:26px;font-weight:700;line-height:1.05}
.hud .lv{text-align:center;font-size:18px;font-weight:700;color:var(--cyan)}
.hud .rt{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.lives{display:flex;gap:5px}
.lives i{width:14px;height:14px;border-radius:3px;background:var(--go);box-shadow:0 0 8px rgba(61,255,154,.7)}
.lives i.off{background:rgba(255,255,255,.1);box-shadow:none}
#combo{font-size:20px;font-weight:700;color:var(--gold);min-height:24px;transition:transform .12s}
#combo.pop{transform:scale(1.35)}
#timebar{width:var(--sz-bar,min(92vw,520px));height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
#timebar span{display:block;height:100%;width:0;background:var(--cyan)}
.btn-ico{pointer-events:auto;background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;width:40px;height:40px;font:600 15px var(--body);cursor:pointer}
.ov{position:fixed;inset:0;display:flex;overflow-y:auto;background:rgba(7,5,26,.8);padding-block:calc(env(safe-area-inset-top,0px) + 20px) calc(env(safe-area-inset-bottom,0px) + 20px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:5}
.box{margin:auto;width:min(420px,100%);display:flex;flex-direction:column;gap:16px;text-align:center}
.eyebrow{font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:var(--cyan);font-weight:700}
h1{font-family:var(--display);font-weight:700;font-size:clamp(46px,14vw,66px);line-height:.92;margin:0;letter-spacing:.02em;color:var(--text);text-shadow:0 0 18px rgba(61,255,154,.7),0 0 2px #fff}
h1 span{color:var(--go)}
.logo{display:grid;grid-template-columns:repeat(4,22px);gap:5px;justify-content:center}
.logo i{width:22px;height:22px;border-radius:4px;background:var(--tile);box-shadow:inset 0 0 0 1px rgba(90,70,200,.4)}
.logo i.g{background:var(--go);box-shadow:0 0 10px rgba(61,255,154,.7)}
.logo i.r{background:var(--no);box-shadow:0 0 10px rgba(255,61,94,.7)}
.logo i.y{background:var(--gold);box-shadow:0 0 10px rgba(255,194,46,.8)}
.how{color:var(--muted);font-size:17px;line-height:1.35;margin:0}
.legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:15px;color:var(--muted)}
.legend div{display:flex;flex-direction:column;align-items:center;gap:6px;background:rgba(46,36,112,.35);border-radius:10px;padding:10px 6px}
.legend b{width:26px;height:26px;border-radius:5px}
.play{font:700 24px var(--display);letter-spacing:.12em;color:#06231A;background:var(--go);border:0;border-radius:14px;padding:18px 0;cursor:pointer;box-shadow:0 0 26px rgba(61,255,154,.55);animation:breathe 2.2s ease-in-out infinite}
.play:active{transform:scale(.97)}
@keyframes breathe{50%{box-shadow:0 0 40px rgba(61,255,154,.85)}}
.ghost{font:700 16px var(--body);letter-spacing:.06em;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:12px;padding:12px 0;cursor:pointer}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.best{font-family:var(--display);color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
.best b{color:var(--text)}
.big{font-family:var(--display);font-size:64px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--text);text-shadow:0 0 22px rgba(61,255,154,.6)}
.meta{color:var(--muted);font-size:16px}
.rec{align-self:center;font:700 14px var(--display);letter-spacing:.14em;color:#3A2400;background:var(--gold);padding:5px 12px;border-radius:999px}
.namef{display:flex;gap:8px}
.namef input{flex:1;min-width:0;font:700 20px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--text);background:var(--deep);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none}
.namef input:focus{border-color:var(--go);box-shadow:0 0 0 2px rgba(61,255,154,.25)}
.namef button{font:700 16px var(--body);color:#140A2E;background:var(--core);border:0;border-radius:12px;padding:0 16px;cursor:pointer}
.err{color:var(--no);font-size:15px;min-height:18px;margin:-8px 0 0;text-align:left}
.board{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.tabs button{font:700 15px var(--body);letter-spacing:.06em;color:var(--muted);background:transparent;border:1px solid transparent;border-radius:10px;padding:8px 0;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--text);border-color:var(--line);background:rgba(46,36,112,.5)}
.board ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
.board li{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;gap:10px;align-items:baseline;padding:6px;border-radius:8px;font-size:17px}
.board li .rk{font-family:var(--display);color:var(--muted)}
.board li .nm{font-weight:700;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board li .wv{color:var(--muted);font-size:14px}
.board li .pt{font-family:var(--display);font-weight:700}
.board li:nth-child(1) .rk{color:var(--gold)} .board li:nth-child(2) .rk{color:#D9D4FF} .board li:nth-child(3) .rk{color:#E08A5A}
.board li.me{background:rgba(61,255,154,.12);outline:1px solid rgba(61,255,154,.5)}
.board .empty,.board .note{color:var(--muted);font-size:15px;padding:8px 6px}
.board .note{font-size:13px;padding:6px 6px 0}
.site{color:var(--muted);font-size:14px;letter-spacing:.12em}
.pause{font:700 30px var(--display);letter-spacing:.2em}
.banner{position:fixed;left:0;right:0;top:42%;text-align:center;font:700 clamp(34px,10vw,52px) var(--display);color:var(--text);text-shadow:0 0 20px rgba(61,255,154,.9);pointer-events:none;opacity:0;z-index:3}
.banner small{display:block;font:600 18px var(--body);color:var(--cyan);letter-spacing:.1em;text-shadow:none}
.banner.on{animation:ban 1.3s forwards}
@keyframes ban{0%{opacity:0;transform:scale(.7)}15%{opacity:1;transform:scale(1.05)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.play{animation:none}#grid.shake{animation:none}}
</style>

<div class="stage" id="stage" aria-hidden="true">
  <div id="grid"></div>
  <div id="timebar"><span id="tb"></span></div>
</div>
<div class="banner" id="banner"></div>

<div class="hud" id="hud" hidden>
  <div><small>Score</small><div class="sc" id="hScore">0</div><div id="combo"></div></div>
  <div class="lv"><small>Niveau</small><span id="hLevel">1</span></div>
  <div class="rt"><button class="btn-ico" id="hMute" aria-label="Couper le son">♪</button><div class="lives" id="hLives"><i></i><i></i><i></i></div></div>
</div>

<section class="ov" id="scrStart">
  <div class="box">
    <div class="eyebrow">GoPlay Arena</div>
    <div class="logo" aria-hidden="true"><i class="g"></i><i></i><i class="r"></i><i></i><i></i><i class="y"></i><i></i><i class="g"></i><i class="r"></i><i></i><i class="g"></i><i></i><i></i><i class="g"></i><i></i><i class="r"></i></div>
    <h1>Pixel<br><span>Rush</span></h1>
    <p class="how">Touche les dalles vertes avant qu'elles s'éteignent. Jamais les rouges. Plus tu enchaînes, plus ça rapporte.</p>
    <div class="legend">
      <div><b style="background:#3DFF9A"></b>Touche · 10</div>
      <div><b style="background:#FF3D5E"></b>Interdit</div>
      <div><b style="background:#FFC22E"></b>Bonus · 50</div>
    </div>
    <div class="best" id="sBest"></div>
    <button class="play" id="bPlay">JOUER</button>
    <div class="row2">
      <button class="ghost" id="bBoard">Classement</button>
      <button class="ghost" id="bMute">Son : oui</button>
    </div>
    <div class="site">goplayarena.re</div>
  </div>
</section>

<section class="ov" id="scrBoard" hidden>
  <div class="box">
    <div class="eyebrow">Classement Pixel Rush</div>
    <div class="board" id="boardA"></div>
    <button class="play" id="bBoardPlay">JOUER</button>
    <button class="ghost" id="bBoardBack">Retour</button>
  </div>
</section>

<section class="ov" id="scrOver" hidden>
  <div class="box">
    <div class="eyebrow" id="oTitle">Partie terminée</div>
    <div class="big" id="oScore">0</div>
    <div class="meta" id="oMeta"></div>
    <div class="rec" id="oRec" hidden>NOUVEAU RECORD</div>
    <form class="namef" id="fName" autocomplete="off">
      <input id="iName" maxlength="14" placeholder="Ton nom" aria-label="Ton nom pour le classement" enterkeyhint="done">
      <button type="submit" id="bSave">Enregistrer</button>
    </form>
    <p class="err" id="oErr"></p>
    <div class="board" id="boardB"></div>
    <button class="play" id="bAgain">REJOUER</button>
    <button class="ghost" id="bOverMenu">Retour au menu</button>
  </div>
</section>

<section class="ov" id="scrPause" hidden>
  <div class="box"><div class="pause">PAUSE</div><button class="play" id="bResume">REPRENDRE</button></div>
</section>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function fmt(n){return Math.round(n).toLocaleString("fr-FR")}

/* ---------- Classement (même API que Arena Defender, jeu = pixel) ---------- */
var GAME="pixel";
var API=/(^|\.)goplayarena\.re$/.test(location.hostname)?"/wp-json/gpa-jeu/v1/scores":null;
function today(){try{return new Intl.DateTimeFormat("en-CA",{timeZone:"Indian/Reunion",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date())}catch(e){return new Date().toISOString().slice(0,10)}}
function localGet(){var o;try{o=JSON.parse(store("gpap_scores")||"{}")}catch(e){o={}}o.all=o.all||[];if(o.day!==today()){o.day=today();o.today=[]}o.today=o.today||[];return o}
function localTop(l){return l.slice().sort(function(a,b){return b.score-a.score}).slice(0,10)}
function fetchBoard(p){
  if(API)return fetch(API+"?game="+GAME+"&period="+p,{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){return j.scores||[]});
  var o=localGet();return Promise.resolve(localTop(p==="day"?o.today:o.all));
}
function submitScore(e){
  e.game=GAME;
  if(API)return fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(e)}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.message||"Envoi impossible");return j})});
  var o=localGet(),row={id:"l"+Date.now(),name:e.name,score:e.score,wave:e.wave};
  o.all.push(row);o.today.push(row);o.all=o.all.sort(function(a,b){return b.score-a.score}).slice(0,50);o.today=o.today.sort(function(a,b){return b.score-a.score}).slice(0,50);
  store("gpap_scores",JSON.stringify(o));
  return Promise.resolve({id:row.id,rank_day:o.today.filter(function(r){return r.score>e.score}).length+1});
}
var boardPeriod="day",myId=null;
function renderBoard(el){
  el.innerHTML='<div class="tabs" role="tablist"><button role="tab" data-p="day" aria-selected="'+(boardPeriod==="day")+'">Aujourd\'hui</button><button role="tab" data-p="all" aria-selected="'+(boardPeriod==="all")+'">Tout temps</button></div><ol><li><span class="empty">Chargement…</span></li></ol>';
  el.querySelectorAll("[data-p]").forEach(function(b){b.onclick=function(){boardPeriod=b.dataset.p;renderBoard(el)}});
  var ol=el.querySelector("ol"),p=boardPeriod;
  fetchBoard(p).then(function(rows){
    if(p!==boardPeriod)return;ol.textContent="";
    if(!rows.length){ol.innerHTML='<li><span class="empty" style="grid-column:1/-1">Personne encore. La première place est à prendre.</span></li>';return}
    rows.forEach(function(r,i){
      var li=document.createElement("li");if(myId&&r.id===myId)li.className="me";
      var a=document.createElement("span");a.className="rk";a.textContent=i+1;
      var n=document.createElement("span");n.className="nm";n.textContent=r.name;
      var w=document.createElement("span");w.className="wv";w.textContent="N"+r.wave;
      var s=document.createElement("span");s.className="pt";s.textContent=fmt(r.score);
      li.append(a,n,w,s);ol.appendChild(li);
    });
    if(!API){var nt=document.createElement("div");nt.className="note";nt.textContent="Version d'essai : classement de cet appareil uniquement.";el.appendChild(nt)}
  }).catch(function(){ol.innerHTML='<li><span class="empty" style="grid-column:1/-1">Classement indisponible. Vérifie ta connexion.</span></li>'});
}

/* ---------- Son ---------- */
var AC=null,muted=store("gpaj_mute")==="1";
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}if(AC&&AC.state==="suspended")AC.resume()}
function tone(f1,f2,dur,type,vol,delay){
  if(muted||!AC)return;var t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||"square";o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+dur);
  g.gain.setValueAtTime(vol||.07,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.02);
}
var NOTES=[523,587,659,784,880,1046,1175,1318];
var SFX={
  hit:function(m){var f=NOTES[Math.min(7,m-1)];tone(f,f*1.01,.09,"square",.06)},
  gold:function(){[784,1046,1318,1568].forEach(function(f,i){tone(f,f,.08,"triangle",.07,i*.05)})},
  bad:function(){tone(220,70,.3,"sawtooth",.13)},
  miss:function(){tone(330,160,.18,"triangle",.09)},
  level:function(){[523,659,784,1046].forEach(function(f,i){tone(f,f,.1,"square",.05,i*.07)})},
  over:function(){[440,330,220,110].forEach(function(f,i){tone(f,f*.9,.22,"sawtooth",.08,i*.16)})}
};
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
function syncMute(){$("bMute").textContent="Son : "+(muted?"non":"oui");$("hMute").style.opacity=muted?.4:1;$("hMute").setAttribute("aria-label",muted?"Activer le son":"Couper le son")}
function toggleMute(){muted=!muted;store("gpaj_mute",muted?"1":"0");syncMute();audio()}
$("bMute").onclick=toggleMute;$("hMute").onclick=toggleMute;syncMute();

/* ---------- Grille ---------- */
var grid=$("grid"),cells=[],N=0;
function buildGrid(n){
  N=n;grid.style.setProperty("--n",n);grid.textContent="";cells=[];
  for(var i=0;i<n*n;i++){
    var b=document.createElement("button");b.className="cell";b.type="button";b.tabIndex=-1;b.setAttribute("aria-label","Dalle "+(i+1));
    var bar=document.createElement("span");bar.className="bar";b.appendChild(bar);
    (function(idx){b.addEventListener("pointerdown",function(e){e.preventDefault();press(idx)})})(i);
    grid.appendChild(b);cells.push({el:b,bar:bar,state:"off",t:0,life:0});
  }
}
function setCell(c,state,life){
  c.el.classList.remove("go","no","gold","bad","miss","hit");
  c.state=state;c.t=0;c.life=life||0;
  if(state!=="off")c.el.classList.add(state);
  c.bar.style.transform="scaleX(0)";
}
function fx(c,txt,col){var s=document.createElement("span");s.className="fx";s.textContent=txt;if(col)s.style.color=col;c.el.appendChild(s);setTimeout(function(){s.remove()},620)}
function flashCls(c,cls,ms){c.el.classList.add(cls);setTimeout(function(){c.el.classList.remove(cls)},ms)}
buildGrid(3);

/* ---------- Jeu ---------- */
var g=null,last=0;
function lvlParams(l){
  return {
    every:Math.max(.28,.85-l*.05),          /* délai entre deux dalles */
    life:Math.max(.62,1.55-l*.08),          /* temps pour toucher une verte */
    red:Math.min(.38,.12+l*.025),           /* part de rouges */
    redLife:Math.max(.8,1.35-l*.04),
    multi:l>=5?Math.min(.4,(l-4)*.07):0     /* deux dalles d'un coup */
  };
}
function newGame(){
  g={run:true,paused:false,score:0,level:1,hits:0,lives:3,streak:0,maxStreak:0,t:0,next:.6,taps:0,good:0,misses:0,reds:0};
  buildGrid(3);cells.forEach(function(c){setCell(c,"off")});
  syncHud();banner("NIVEAU 1","Que les vertes !");
}
function mult(){return Math.min(8,1+Math.floor(g.streak/5))}
function syncHud(){
  $("hScore").textContent=fmt(g.score);$("hLevel").textContent=g.level;
  var li=$("hLives").children;for(var i=0;i<3;i++)li[i].className=i<g.lives?"":"off";
  var el=$("combo"),m=mult();el.textContent=g.streak>=5?("x"+m+" · série "+g.streak):"";
  $("tb").style.width=Math.min(100,(g.hits%15)/15*100)+"%";
}
function popCombo(){var el=$("combo");el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop")}
function banner(t,sub){var b=$("banner");b.innerHTML="";b.append(t);if(sub){var s=document.createElement("small");s.textContent=sub;b.appendChild(s)}b.classList.remove("on");void b.offsetWidth;b.classList.add("on")}
function shake(){grid.classList.remove("shake");void grid.offsetWidth;grid.classList.add("shake")}
function loseLife(){
  g.lives--;g.streak=0;buzz(110);shake();syncHud();
  if(g.lives<=0)gameOver();
}
function spawnOne(){
  var free=cells.filter(function(c){return c.state==="off"});if(!free.length)return;
  var c=free[Math.floor(Math.random()*free.length)],P=lvlParams(g.level),r=Math.random();
  if(g.level>=2&&r<.045)setCell(c,"gold",P.life*.8);
  else if(r<P.red+.045&&g.level>=1&&g.t>2)setCell(c,"no",P.redLife);
  else setCell(c,"go",P.life);
}
function press(i){
  if(!g||!g.run)return;if(g.paused){resume();return}
  audio();g.taps++;var c=cells[i];
  if(c.state==="go"||c.state==="gold"){
    var gold=c.state==="gold";g.streak++;g.maxStreak=Math.max(g.maxStreak,g.streak);g.good++;
    var m=mult(),pts=(gold?50:10)*m;
    /* bonus de vitesse : touché vite = +50 % */
    if(!gold&&c.t<c.life*.35)pts=Math.round(pts*1.5);
    g.score+=pts;g.hits++;
    fx(c,"+"+pts,gold?"#7A4A00":"#06231A");setCell(c,"off");flashCls(c,"hit",90);
    if(gold){SFX.gold();if(g.lives<3){g.lives++;fx(c,"+1 VIE","#3DFF9A")}}else SFX.hit(m);
    if(g.streak%5===0)popCombo();
    if(g.hits%15===0)levelUp();
    syncHud();
  }else if(c.state==="no"){
    g.reds++;setCell(c,"off");flashCls(c,"bad",300);fx(c,"✕","#fff");SFX.bad();loseLife();
  }else{
    if(g.streak>=5){g.streak=0;syncHud()}else g.streak=0;
  }
}
function levelUp(){
  g.level++;SFX.level();
  if(g.level===4&&N<4){buildGrid(4);banner("NIVEAU 4","Grille 4 × 4")}
  else if(g.level===9&&N<5){buildGrid(5);banner("NIVEAU 9","Grille 5 × 5")}
  else banner("NIVEAU "+g.level,g.level===5?"Doubles dalles":"Plus vite");
  g.next=.9;
}
function update(dt){
  g.t+=dt;var P=lvlParams(g.level);
  g.next-=dt;
  if(g.next<=0){spawnOne();if(Math.random()<P.multi)spawnOne();g.next=P.every*(.75+Math.random()*.5)}
  for(var i=0;i<cells.length;i++){
    var c=cells[i];if(c.state==="off")continue;
    c.t+=dt;var k=Math.min(1,c.t/c.life);c.bar.style.transform="scaleX("+(1-k)+")";
    if(c.t>=c.life){
      if(c.state==="go"){setCell(c,"off");flashCls(c,"miss",350);SFX.miss();g.misses++;loseLife();if(!g.run)return}
      else setCell(c,"off");
    }
  }
}
function loop(now){
  var dt=Math.min(.05,(now-last)/1000||0);last=now;
  if(g&&g.run&&!g.paused)update(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- Écrans ---------- */
function show(id){["scrStart","scrBoard","scrOver","scrPause"].forEach(function(s){$(s).hidden=s!==id});$("hud").hidden=id!==null}
function best(){return parseInt(store("gpap_best")||"0",10)||0}
function syncBest(){var b=best();$("sBest").innerHTML=b?"Ton record : <b>"+fmt(b)+"</b>":"Le classement t'attend"}
function play(){audio();myId=null;newGame();show(null)}
var saved=false,lastResult=null;
function gameOver(){
  g.run=false;SFX.over();
  cells.forEach(function(c){if(c.state!=="off")setCell(c,"off")});
  var rec=g.score>best();if(rec)store("gpap_best",String(g.score));
  lastResult={score:g.score,wave:g.level,dur:Math.round(g.t),kills:g.good,acc:g.taps?Math.round(g.good/g.taps*100):0};
  saved=false;
  setTimeout(function(){
    $("oScore").textContent=fmt(g.score);
    $("oMeta").textContent="Niveau "+g.level+" · "+g.good+" dalles · meilleure série "+g.maxStreak;
    $("oRec").hidden=!rec||g.score===0;
    $("fName").hidden=g.score===0;$("iName").value=store("gpaj_name")||"";$("oErr").textContent="";
    $("bSave").textContent="Enregistrer";$("bSave").disabled=false;$("iName").disabled=false;
    boardPeriod="day";renderBoard($("boardB"));show("scrOver");
  },700);
}
$("fName").addEventListener("submit",function(e){
  e.preventDefault();if(saved||!lastResult)return;
  var n=$("iName").value.replace(/\s+/g," ").trim();
  if(n.length<2){$("oErr").textContent="Écris au moins 2 lettres.";return}
  store("gpaj_name",n);$("bSave").disabled=true;$("bSave").textContent="Envoi…";$("iName").blur();
  submitScore({name:n,score:lastResult.score,wave:lastResult.wave,dur:lastResult.dur,kills:lastResult.kills}).then(function(j){
    saved=true;myId=j.id;$("bSave").textContent=j.rank_day?(j.rank_day+(j.rank_day===1?"er":"e")+" du jour"):"Enregistré";$("iName").disabled=true;
    boardPeriod="day";renderBoard($("boardB"));
  }).catch(function(err){$("bSave").disabled=false;$("bSave").textContent="Enregistrer";$("oErr").textContent=(err&&err.message)||"Envoi impossible. Réessaie."});
});
$("iName").addEventListener("input",function(){$("oErr").textContent=""});
$("bPlay").onclick=play;$("bAgain").onclick=play;$("bBoardPlay").onclick=play;
$("bBoard").onclick=function(){boardPeriod="day";renderBoard($("boardA"));show("scrBoard")};
$("bBoardBack").onclick=function(){syncBest();show("scrStart")};
function pause(){if(g&&g.run&&!g.paused){g.paused=true;show("scrPause")}}
function resume(){if(g&&g.paused){g.paused=false;last=performance.now();show(null)}}
$("bResume").onclick=function(){audio();resume()};
document.addEventListener("visibilitychange",function(){if(document.hidden)pause()});
$("bOverMenu").onclick=function(){syncBest();show("scrStart")};
syncBest();show("scrStart");
})();
</script>
